name: Bug report
description: Report a grok-bot-cli bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please search existing issues first.
        Do not paste access tokens, refresh tokens, `profiles/*.json`, `accounts.json`, or screenshots of those files.
        Use placeholder names (`alice`, `alice:assistant`). Redact home-directory paths if you include a log.
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `grok-bot accounts list --json`
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `grok-bot --version` (three lines).
      placeholder: grok-bot 0.78.1
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js 22.13+
        - Bun 1.1+
        - Launcher installed Bun for me
        - Not sure
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the `--json` error if you have one. Remove tokens first.
